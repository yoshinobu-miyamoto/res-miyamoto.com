<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RES Pavilion — 平面に打ち、立ち上げる</title>
<meta name="description" content="地面に打設した薄い板が回りながら立ち上がり、高さ 10 m のパビリオンになる。RES（切紙）の起立を構造とする仮想建築。">
<style>:root{color-scheme:dark;--sl:max(28px,env(safe-area-inset-left,0px));--sr:max(28px,env(safe-area-inset-right,0px));--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--ink:#f4efe6;--dim:rgba(244,239,230,.62);--line:rgba(244,239,230,.22)}
*{box-sizing:border-box}
html,body{margin:0;background:#11100f;color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#spacer{height:1200vh}
#hud{position:fixed;inset:0;pointer-events:none;color:var(--ink);text-shadow:0 1px 14px rgba(0,0,0,.55)}
header{position:absolute;top:calc(22px + var(--st));left:var(--sl);right:var(--sr);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;font-size:12px;letter-spacing:.18em}
.brand{font-weight:600}
.site{color:var(--dim);letter-spacing:.08em;text-align:right}
.site span{margin-left:.6em;font-size:10px;opacity:.7;letter-spacing:.02em}
#caption{position:absolute;left:var(--sl);bottom:calc(74px + var(--sb));max-width:min(30em,78vw);transition:opacity .35s}
#caption .no{font-size:12px;letter-spacing:.2em;color:var(--dim);margin-bottom:10px}
#caption h1{margin:0 0 10px;font-weight:300;font-size:clamp(26px,4.2vw,50px);line-height:1.12;letter-spacing:.02em}
#caption p{margin:0;font-size:14px;line-height:1.75;color:var(--dim)}
#readout{position:absolute;right:var(--sr);bottom:calc(74px + var(--sb));font-size:11px;letter-spacing:.06em;min-width:15em;transition:opacity .35s}
#readout div{display:flex;justify-content:space-between;gap:1.5em;padding:6px 0;border-top:1px solid var(--line)}
#readout span{color:var(--dim)}
#readout b{font-weight:500;font-variant-numeric:tabular-nums}
#bar{position:absolute;left:var(--sl);right:var(--sr);bottom:calc(40px + var(--sb));height:1px;background:var(--line)}
#bar i{display:block;height:1px;width:0;background:var(--ink)}
#hint{position:absolute;left:50%;bottom:calc(12px + var(--sb));transform:translateX(-50%);font-size:10px;letter-spacing:.3em;color:var(--dim);transition:opacity .4s}
@media (max-width:640px){:root{--sl:max(16px,env(safe-area-inset-left,0px));--sr:max(16px,env(safe-area-inset-right,0px))}header{top:calc(14px + var(--st))}#caption{bottom:calc(92px + var(--sb))}#readout{left:var(--sl);bottom:calc(46px + var(--sb));display:flex;gap:1.6em;min-width:0}#readout div{border-top:0;padding:0;gap:.7em}#bar{bottom:calc(34px + var(--sb))}.site span{display:none}}
body.paper{--ink:#1d2530;--dim:rgba(29,37,48,.7);--line:rgba(29,37,48,.25)}
body.paper #hud{text-shadow:none}
#hud{transition:color .4s}
#fx{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 52%,rgba(8,6,4,.34) 100%);transition:opacity .5s}
#fx::after{content:"";position:absolute;inset:0;background-image:var(--grain);background-size:180px 180px;opacity:.05;mix-blend-mode:overlay}
body.paper #fx{opacity:.35}
:lang(zh-Hans) body{font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}
:lang(zh-Hant) body{font-family:"Helvetica Neue",Helvetica,Arial,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif}
:lang(ko) body{font-family:"Helvetica Neue",Helvetica,Arial,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
#lang{flex-basis:100%;display:flex;justify-content:flex-end;gap:2px;margin-top:6px;pointer-events:auto;letter-spacing:.04em}
#lang button{appearance:none;background:none;border:0;border-bottom:1px solid transparent;color:var(--dim);font:inherit;font-size:12px;min-width:32px;height:30px;padding:0 6px;cursor:pointer;text-shadow:inherit}
#lang button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
#lang button:focus-visible{outline:1px solid var(--ink);outline-offset:1px}
@media (hover:hover){#lang button:hover{color:var(--ink)}}
#caption h1{text-wrap:balance}
:lang(ko) #caption{word-break:keep-all}
/* 写真・映画ふうの仕上げ（すべて画面の上に重ねる簡易な手法。値は main.js が場面ごとに入れる） */
#gl{filter:var(--look,none)}
#dof{position:absolute;inset:0;-webkit-backdrop-filter:blur(var(--dof,0px));backdrop-filter:blur(var(--dof,0px));-webkit-mask-image:radial-gradient(ellipse 78% 36% at var(--fx,50%) var(--fy,50%),transparent 45%,#000 100%);mask-image:radial-gradient(ellipse 78% 36% at var(--fx,50%) var(--fy,50%),transparent 45%,#000 100%)}
#dof.off{display:none}
#grade{position:absolute;inset:0;mix-blend-mode:soft-light;opacity:var(--gradeA,0);background:linear-gradient(to bottom,var(--gradeT,#808080),var(--gradeB,#808080))}
#vig{position:absolute;inset:0;opacity:var(--vig,0);background:radial-gradient(ellipse at 50% 48%,rgba(0,0,0,0) 40%,rgba(4,3,6,.62) 100%)}
#flare{position:absolute;left:var(--sunx,50%);top:var(--suny,50%);width:150vmax;height:14px;margin:-7px 0 0 -75vmax;opacity:var(--flare,0);mix-blend-mode:screen;filter:blur(3px);background:linear-gradient(90deg,rgba(255,170,110,0) 18%,rgba(255,190,130,.35) 40%,rgba(255,226,190,.9) 50%,rgba(255,190,130,.35) 60%,rgba(255,170,110,0) 82%)}
#flare::after{content:"";position:absolute;left:50%;top:50%;width:46vmin;height:46vmin;margin:-23vmin 0 0 -23vmin;border-radius:50%;background:radial-gradient(circle,rgba(255,214,170,.5) 0,rgba(255,170,110,.16) 35%,rgba(255,150,90,0) 70%)}
#credit{position:absolute;right:var(--sr);bottom:calc(12px + var(--sb));font-size:9px;letter-spacing:.04em;color:var(--dim);opacity:0;transition:opacity .4s;pointer-events:auto}
#credit a{color:inherit}
#credit.on{opacity:.8}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="fx"><div id="dof"></div><div id="grade"></div><div id="vig"></div><div id="flare"></div></div>
<div id="hud">
  <header>
    <div class="brand">RES PAVILION</div>
    <div class="site">Olympic Sculpture Park, Seattle<span id="siteNote">（敷地は抽象表現）</span></div>
    <nav id="lang" aria-label="Language"></nav>
  </header>
  <section id="caption">
    <div class="no" id="capNo">00</div>
    <h1 id="capTitle"></h1>
    <p id="capBody"></p>
  </section>
  <aside id="readout">
    <div><span id="lErect">起立</span><b id="rS">0 %</b></div>
    <div><span id="lHeight">高さ</span><b id="rH">0.20 m</b></div>
  </aside>
  <div id="bar"><i id="barFill"></i></div>
  <div id="hint">scroll ↓</div>
  <div id="credit" lang="en">Figures: CesiumMan &copy; Cesium, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a> (simplified)</div>
</div>
